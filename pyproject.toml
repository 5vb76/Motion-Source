[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["data", "results"]

[tool.ruff.lint]
# Catch syntax, import and undefined-name errors without rewriting research code.
select = ["E4", "E9", "F63", "F7", "F82"]

[tool.ruff.lint.per-file-ignores]
# These standalone experiment scripts set up local module paths before imports.
"code/**/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["code/core"]
